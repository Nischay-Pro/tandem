name: tandem

services:
  tandem-postgres:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    restart: unless-stopped
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tandem-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - tandem-data

  tandem-api:
    image: ghcr.io/nischay-pro/tandem-api:${TANDEM_API_TAG:-latest-nightly}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${TANDEM_API_HOST_PORT:-19753}:19753"
    environment:
      DATABASE_URL: postgresql://tandem:${POSTGRES_PASSWORD}@tandem-postgres:5432/tandem
      HOST: 0.0.0.0
      PORT: 19753
      ACTUAL_SERVER_URL: ${ACTUAL_SERVER_URL}
    depends_on:
      tandem-postgres:
        condition: service_healthy
    expose:
      - "19753"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19753/extension/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    networks:
      - tandem-data
      - tandem-edge

volumes:
  tandem-postgres-data:

networks:
  tandem-data:
    internal: true
  tandem-edge:
    name: ${TANDEM_EDGE_NETWORK:-tandem-edge}
    external: true
