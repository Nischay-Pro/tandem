name: tandem

services:
  tandem-postgres:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TANDEM_POSTGRES_DB:-tandem}
      POSTGRES_USER: ${TANDEM_POSTGRES_USER:-tandem}
      POSTGRES_PASSWORD_FILE: /run/secrets/tandem_postgres_password
    volumes:
      - tandem-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - tandem-data
    secrets:
      - tandem_postgres_password

  tandem-api:
    image: ${TANDEM_API_IMAGE:?Run the setup command to choose a digest-pinned API image}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL_FILE: /run/secrets/tandem_database_url
      AUTH_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/tandem_auth_token_encryption_key
      AUTH_TOKEN_ENCRYPTION_KEY_PREVIOUS_FILE: /run/secrets/tandem_auth_token_encryption_key_previous
      HOST: 0.0.0.0
      PORT: 19753
      TRUST_PROXY: ${TANDEM_TRUST_PROXY:-}
      ACTUAL_SERVER_URL: ${TANDEM_ACTUAL_SERVER_URL:-}
      ACTUAL_SESSION_TOKEN_FILE: /run/secrets/tandem_actual_session_token
      ACTUAL_PUBLIC_URL: ${TANDEM_ACTUAL_PUBLIC_URL:-}
      ACTUAL_API_DATA_DIR: /data/actual-api
    depends_on:
      tandem-postgres:
        condition: service_healthy
    volumes:
      - tandem-actual-workspace:/data/actual-api
    expose:
      - "19753"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19753/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s
    networks:
      - tandem-data
      - tandem-edge
    secrets:
      - tandem_database_url
      - tandem_actual_session_token
      - tandem_auth_token_encryption_key
      - tandem_auth_token_encryption_key_previous

secrets:
  tandem_postgres_password:
    file: ${TANDEM_POSTGRES_PASSWORD_FILE:?Set TANDEM_POSTGRES_PASSWORD_FILE in deploy/compose/.env}
  tandem_database_url:
    file: ${TANDEM_DATABASE_URL_FILE:?Set TANDEM_DATABASE_URL_FILE in deploy/compose/.env}
  tandem_actual_session_token:
    file: ${TANDEM_ACTUAL_SESSION_TOKEN_FILE:?Set TANDEM_ACTUAL_SESSION_TOKEN_FILE in deploy/compose/.env}
  tandem_auth_token_encryption_key:
    file: ${TANDEM_AUTH_TOKEN_ENCRYPTION_KEY_FILE:?Set TANDEM_AUTH_TOKEN_ENCRYPTION_KEY_FILE in deploy/compose/.env}
  tandem_auth_token_encryption_key_previous:
    file: ${TANDEM_AUTH_TOKEN_ENCRYPTION_KEY_PREVIOUS_FILE:?Set TANDEM_AUTH_TOKEN_ENCRYPTION_KEY_PREVIOUS_FILE in deploy/compose/.env}

volumes:
  tandem-postgres-data:
  tandem-actual-workspace:

networks:
  tandem-data:
    internal: true
  tandem-edge:
    name: ${TANDEM_EDGE_NETWORK:-tandem-edge}
    external: true
