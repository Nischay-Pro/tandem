name: tandem

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/compose/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/compose/.env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - data
    secrets:
      - postgres_password

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/auth_token_encryption_key
      HOST: 0.0.0.0
      PORT: 19753
      TRUST_PROXY: ${TRUST_PROXY:?Set TRUST_PROXY to the reverse proxy IP or narrow CIDR in deploy/compose/.env}
      CHANGE_FEED_EPOCH: ${CHANGE_FEED_EPOCH:?Set CHANGE_FEED_EPOCH in deploy/compose/.env}
      ACTUAL_SERVER_URL: ${ACTUAL_SERVER_URL:-}
      ACTUAL_PUBLIC_URL: ${ACTUAL_PUBLIC_URL:-}
      ACTUAL_API_DATA_DIR: /data/actual-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - actual-workspace:/data/actual-api
    expose:
      - "19753"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:19753/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s
    networks:
      - data
      - edge
    secrets:
      - database_url
      - auth_token_encryption_key

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE in deploy/compose/.env}
  database_url:
    file: ${DATABASE_URL_FILE:?Set DATABASE_URL_FILE in deploy/compose/.env}
  auth_token_encryption_key:
    file: ${AUTH_TOKEN_ENCRYPTION_KEY_FILE:?Set AUTH_TOKEN_ENCRYPTION_KEY_FILE in deploy/compose/.env}

volumes:
  postgres-data:
  actual-workspace:

networks:
  data:
    internal: true
  edge:
    name: ${TANDEM_EDGE_NETWORK:-tandem-edge}
    external: true
