services:
  tandem-api:
    volumes:
      - tandem-actual-workspace:/data/actual-api

volumes:
  tandem-postgres-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m
  tandem-actual-workspace:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=8m
