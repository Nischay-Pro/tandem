version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns:
          - "*"

  # The root pnpm lockfile is shared by the root package and services/* workspaces.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: America/Los_Angeles
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: America/Los_Angeles
    groups:
      gradle-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: America/Los_Angeles
    groups:
      docker-compose-updates:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: America/Los_Angeles
    groups:
      api-docker-updates:
        patterns:
          - "*"
