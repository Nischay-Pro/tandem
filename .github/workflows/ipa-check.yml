name: IPA build check

on:
  push:
    branches: [feat/nightly-ipa]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TANDEM_PREGENERATED_ICON_PACK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache_kotlin_native: "true"
          setup_node: "true"
          gradle_cache_key: ios-arm64
      - run: node scripts/generate-thesvg-icon-pack.mjs --output mobile/composeApp/build/generated/thesvg-icon-pack/composeResources
      - run: bash scripts/build-ios-ipa.sh "$RUNNER_TEMP/Tandem-check.ipa" 1 && unzip -l "$RUNNER_TEMP/Tandem-check.ipa" | tail -3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tandem-ipa-check
          path: ${{ runner.temp }}/Tandem-check.ipa
