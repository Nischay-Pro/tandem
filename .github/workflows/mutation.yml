name: Mutation tests

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-mutation:
    name: Full financial-path mutation suite
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare writable mutation workspace
        run: |
          mkdir -p .dev-tmp/stryker
          sudo chown -R 1000:1000 .dev-tmp/stryker

      - name: Run the full mutation suite against disposable PostgreSQL
        run: >-
          docker compose -f docker-compose.dev.yml --profile test run --build
          --rm integration-tests pnpm test:mutation:full

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans
