name: App screenshots

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which screenshots to capture
        type: choice
        default: both
        options: [both, ios, android]

permissions:
  contents: read
  actions: read

jobs:
  ios:
    name: iPhone and iPad screenshots
    if: ${{ inputs.platforms != 'android' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ACTUAL_URL: http://localhost:5006
      DEMO_PASSWORD: demo-password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
          run_install: false
          cache: true

      - name: Install the API's dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the simulator app built from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 50); do
            read -r run_id status conclusion < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ "$status" = completed ]; then break; fi
            sleep 60
          done
          if [ "${conclusion:-}" != success ]; then
            echo "::error::CI for $GITHUB_SHA did not pass (${conclusion:-no run}); capture from a commit whose CI passed."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name ios-simulator-app --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && unzip -q TandemForActual-simulator.zip)
          test -d "$RUNNER_TEMP/TandemForActual.app"

      - name: Start Actual
        run: |
          mkdir -p "$RUNNER_TEMP/actual"
          ACTUAL_PORT=5006 ACTUAL_DATA_DIR="$RUNNER_TEMP/actual" \
            nohup npx --yes @actual-app/sync-server@26.11.0 > "$RUNNER_TEMP/actual.log" 2>&1 &
          for _ in $(seq 1 120); do curl -fs "$ACTUAL_URL/account/needs-bootstrap" >/dev/null && break; sleep 1; done
          curl -fs "$ACTUAL_URL/account/needs-bootstrap"

      - name: Seed the demo budget
        env:
          DEMO_VARIANTS: envelope
        run: node scripts/screenshots/seed-demo.mjs

      - name: Capture screenshots
        run: |
          app="$RUNNER_TEMP/TandemForActual.app"
          out="$RUNNER_TEMP/screenshots"
          mkdir -p "$out"
          runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')"
          pick() {
            xcrun simctl list devicetypes -j | python3 -c 'import json,re,sys; t=[d for d in json.load(sys.stdin)["devicetypes"] if re.search(sys.argv[1], d["name"])]; print(t[-1]["identifier"] if t else "")' "$1"
          }
          shoot() {
            local name="$1" type="$2" udid
            [ -n "$type" ] || { echo "No simulator for $name"; return; }
            udid="$(xcrun simctl create "$name" "$type" "$runtime")"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" "$app"
            local wait=60
            for mode in light dark; do
              xcrun simctl ui "$udid" appearance "$mode"
              for spec in budget: activity:Corner\ Market accounts:Everyday\ checking reports: category:Phone; do
                local screen="${spec%%:*}" select="${spec#*:}"
                xcrun simctl terminate "$udid" app.tandemforactual.ios >/dev/null 2>&1 || true
                SIMCTL_CHILD_TANDEM_SCREENSHOT_SERVER="$ACTUAL_URL" \
                SIMCTL_CHILD_TANDEM_SCREENSHOT_PASSWORD="$DEMO_PASSWORD" \
                SIMCTL_CHILD_TANDEM_SCREENSHOT_BUDGET="Demo household" \
                SIMCTL_CHILD_TANDEM_SCREENSHOT_SCREEN="$screen" \
                SIMCTL_CHILD_TANDEM_SCREENSHOT_SELECT="$select" \
                  xcrun simctl launch "$udid" app.tandemforactual.ios
                sleep "$wait"
                wait=20
                xcrun simctl io "$udid" screenshot "$out/$name-$mode-$screen.png"
              done
            done
            xcrun simctl shutdown "$udid"
          }
          shoot iphone-17 "$(pick '^iPhone 17$')"
          shoot iphone-duo "$(pick 'iPhone Duo')"
          shoot ipad "$(pick 'iPad Pro 13')"
          ls -la "$out"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/*.log
          if-no-files-found: warn
          retention-days: 14

  apple_watch:
    name: Apple Watch screenshots
    if: ${{ inputs.platforms != 'android' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the simulator app built from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 50); do
            read -r run_id status conclusion < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId,status,conclusion --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ "$status" = completed ]; then break; fi
            sleep 60
          done
          if [ "${conclusion:-}" != success ]; then
            echo "::error::CI for $GITHUB_SHA did not pass (${conclusion:-no run}); capture from a commit whose CI passed."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name ios-simulator-app --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && unzip -q TandemForActual-simulator.zip)
          test -d "$RUNNER_TEMP/TandemForActual.app"

      - name: Capture Apple Watch screenshots
        run: |
          watch_app="$RUNNER_TEMP/TandemForActual.app/Watch/TandemWatch.app"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$watch_app/Info.plist")"
          out="$RUNNER_TEMP/screenshots"
          mkdir -p "$out"
          runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="watchOS" and x["isAvailable"]]; print(r[-1]["identifier"] if r else "")')"
          if [ -z "$runtime" ]; then
            echo "::notice::No watchOS simulator runtime on this runner image; skipping Apple Watch screenshots."
            exit 0
          fi
          summary="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' scripts/screenshots/watch-demo-summary.json)"
          pick() {
            xcrun simctl list devicetypes -j | python3 -c 'import json,re,sys; t=[d for d in json.load(sys.stdin)["devicetypes"] if re.search(sys.argv[1], d["name"])]; print(t[-1]["identifier"] if t else "")' "$1"
          }
          shoot_watch() {
            local name="$1" type="$2" udid
            [ -n "$type" ] || { echo "No simulator for $name"; return; }
            udid="$(xcrun simctl create "$name" "$type" "$runtime")"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$watch_app"
            for screen in glance bills add; do
              xcrun simctl terminate "$udid" "$bundle" >/dev/null 2>&1 || true
              SIMCTL_CHILD_TANDEM_SCREENSHOT_WATCH_SUMMARY="$summary" \
              SIMCTL_CHILD_TANDEM_SCREENSHOT_WATCH_SCREEN="$screen" \
                xcrun simctl launch "$udid" "$bundle"
              sleep 15
              xcrun simctl io "$udid" screenshot "$out/$name-$screen.png"
            done
            xcrun simctl shutdown "$udid"
          }
          shoot_watch apple-watch-46mm "$(pick '^Apple Watch Series .*46mm')"
          shoot_watch apple-watch-ultra "$(pick '^Apple Watch Ultra')"
          ls -la "$out"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-watch-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14

  android_build:
    name: Android debug build for screenshots
    if: ${{ inputs.platforms != 'ios' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_android: "true"
          setup_node: "true"

      - name: Build the debug apps
        working-directory: mobile
        run: ./gradlew :androidApp:assembleDebug :wearApp:assembleDebug

      - name: Upload the debug app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload the debug watch app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wear-debug-apk
          path: mobile/wearApp/build/outputs/apk/debug/wearApp-debug.apk
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android ${{ matrix.set }} screenshots
    needs: android_build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: phone
            profiles: pixel_7
          - set: foldable-1-1
            profiles: foldable_1_1|pixel_9_pro_fold|8in Foldable
          - set: foldable-4-3
            profiles: foldable_4_3|pixel_fold|7.6in Foldable
          - set: tablet
            profiles: medium_tablet|pixel_tablet
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_android: "true"
          setup_node: "true"

      - name: Choose the emulator profile
        id: profile
        env:
          PROFILES: ${{ matrix.profiles }}
        run: |
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          [[ -x "$avdmanager" ]] || avdmanager="$(command -v avdmanager)"
          available="$("$avdmanager" list device -c)"
          echo "$available" | tr '\n' ','
          echo
          IFS='|' read -ra candidates <<<"$PROFILES"
          for candidate in "${candidates[@]}"; do
            if grep -qx "$candidate" <<<"$available"; then
              echo "id=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using $candidate"
              exit 0
            fi
          done
          echo "None of $PROFILES are available" >&2
          exit 1

      - name: Download the debug app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-apk
          path: ${{ runner.temp }}/apk

      - name: Start Actual
        run: |
          docker run -d --name tandem-actual -p 127.0.0.1:5006:5006 ghcr.io/actualbudget/actual:26.11.0
          for _ in $(seq 1 120); do curl -fs http://localhost:5006/account/needs-bootstrap >/dev/null && break; sleep 1; done

      - name: Seed the demo budget
        env:
          DEMO_VARIANTS: envelope
        run: node scripts/screenshots/seed-demo.mjs

      - name: Capture screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: ${{ steps.profile.outputs.id }}
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          script: bash scripts/screenshots/capture-android.sh "${{ runner.temp }}/apk/androidApp-debug.apk" "${{ runner.temp }}/screenshots/raw" ${{ matrix.set }} http://10.0.2.2:5006

      - name: Sort into Play listing sets
        shell: bash
        run: python3 scripts/screenshots/play-sets.py "$RUNNER_TEMP/screenshots/raw" "$RUNNER_TEMP/screenshots/play" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshots-${{ matrix.set }}
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/*.log
          if-no-files-found: warn
          retention-days: 14

  wear:
    name: Wear OS ${{ matrix.set }} screenshots
    needs: android_build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: large-round
            profile: wearos_large_round
          - set: small-round
            profile: wearos_small_round
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Download the debug watch app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wear-debug-apk
          path: ${{ runner.temp }}/apk

      - name: Capture screenshots
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          script: bash scripts/screenshots/capture-wear.sh "${{ runner.temp }}/apk/wearApp-debug.apk" "${{ runner.temp }}/screenshots" ${{ matrix.set }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wear-screenshots-${{ matrix.set }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14
