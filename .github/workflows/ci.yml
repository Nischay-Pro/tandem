name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation links and toolchain versions
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: ./scripts/check-github-workflows.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Test documentation checks
        run: node --test scripts/check-docs.test.mjs

      - name: Check local documentation links and toolchain versions
        run: node scripts/check-docs.mjs

  merchant_icon_pack:
    name: Generate merchant icon resources on Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
          cache: true

      - name: Install icon pack build dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate merchant icon resources
        run: node scripts/generate-thesvg-icon-pack.mjs --output mobile/composeApp/build/generated/thesvg-icon-pack/composeResources

      - name: Upload merchant icon resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tandem-merchant-icon-pack-${{ github.sha }}
          path: mobile/composeApp/build/generated/thesvg-icon-pack/composeResources
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  mobile_static:
    name: Mobile text and design-token checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check mobile UI apostrophes
        run: python3 scripts/check-mobile-ui-apostrophes.py

      - name: Check mobile design tokens
        run: python3 scripts/check-mobile-design-tokens.py

      - name: Check mobile UI vocabulary
        run: python3 scripts/check-mobile-ui-vocabulary.py

      - name: Check iOS Compose runtime properties
        run: python3 scripts/check-ios-info-plist.py

      - name: Test mobile UI vocabulary guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_mobile_ui_vocabulary.py'

  api_android_jvm:
    name: API client · Android and JVM
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_android: "true"

      - name: Compile and test API client Android and JVM targets
        working-directory: mobile
        run: >-
          ./gradlew
          :api-client:compileAndroidMain
          :api-client:compileCommonMainKotlinMetadata
          :api-client:jvmTest
          :api-client:testAndroidHostTest
          :api-client:koverVerify
          :api-client:ktlintCheck

  data_android_jvm:
    name: Data · Android and JVM
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_android: "true"

      - name: Compile and test data Android and JVM targets
        working-directory: mobile
        run: >-
          ./gradlew
          :data:compileAndroidMain
          :data:compileAndroidDeviceTest
          :data:compileCommonMainKotlinMetadata
          :data:compileKotlinJvm
          :data:jvmTest
          :data:testAndroidHostTest
          :data:koverVerify
          :data:ktlintCheck

  compose_android:
    name: Compose · Android host
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_node: "true"
          setup_android: "true"

      - name: Compile and test Compose Android host targets
        working-directory: mobile
        run: >-
          ./gradlew
          :composeApp:compileAndroidMain
          :composeApp:testAndroidHostTest
          :composeApp:ktlintCheck

  android_app_unit_tests:
    name: Android app · unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_node: "true"
          setup_android: "true"

      - name: Run Android app unit tests
        working-directory: mobile
        run: ./gradlew :androidApp:testDebugUnitTest

  android_app_release_lint:
    name: Android app · release lint
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_node: "true"
          setup_android: "true"

      - name: Run Android release lint
        working-directory: mobile
        run: ./gradlew :androidApp:lintRelease

  android_app_release:
    name: Android app · release assembly
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_node: "true"
          setup_android: "true"

      - name: Assemble Android release
        working-directory: mobile
        run: ./gradlew :androidApp:assembleRelease

  ios_host:
    name: iOS app · Xcode simulator tests and launch smoke
    needs: merchant_icon_pack
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TANDEM_PREGENERATED_ICON_PACK: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache_kotlin_native: "true"

      - name: Download merchant icon resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tandem-merchant-icon-pack-${{ github.sha }}
          path: mobile/composeApp/build/generated/thesvg-icon-pack/composeResources

      - name: Verify merchant icon resources
        run: test -f mobile/composeApp/build/generated/thesvg-icon-pack/composeResources/files/merchant-icon-catalog.json

      - name: Warm cached Compose framework
        working-directory: mobile
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Test iOS app host and background scheduler
        working-directory: mobile
        run: |
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $2 ~ /^[[:xdigit:]-]+$/ { print $2; exit }')"
          test -n "$simulator_id"
          xcodebuild \
            -project iosApp/TandemForActual.xcodeproj \
            -scheme TandemForActual \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -resultBundlePath "$RUNNER_TEMP/TandemForActual.xcresult" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload Xcode simulator test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-host-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/TandemForActual.xcresult
          if-no-files-found: warn
          retention-days: 7

  api_ios:
    name: API client · iOS architectures
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache_kotlin_native: "true"

      - name: Compile API client iOS architectures
        working-directory: mobile
        run: >-
          ./gradlew
          :api-client:compileCommonMainKotlinMetadata
          :api-client:compileKotlinIosArm64
          :api-client:compileKotlinIosSimulatorArm64

  data_ios:
    name: Data · iOS architectures and simulator tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache_kotlin_native: "true"

      - name: Compile and test data iOS targets
        working-directory: mobile
        run: >-
          ./gradlew
          :data:compileCommonMainKotlinMetadata
          :data:compileKotlinIosArm64
          :data:compileKotlinIosSimulatorArm64
          :data:iosSimulatorArm64Test

  compose_ios:
    name: Compose · iOS architectures and simulator tests
    needs: merchant_icon_pack
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TANDEM_PREGENERATED_ICON_PACK: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache_kotlin_native: "true"

      - name: Download merchant icon resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tandem-merchant-icon-pack-${{ github.sha }}
          path: mobile/composeApp/build/generated/thesvg-icon-pack/composeResources

      - name: Verify merchant icon resources
        run: test -f mobile/composeApp/build/generated/thesvg-icon-pack/composeResources/files/merchant-icon-catalog.json

      - name: Compile and test Compose iOS targets
        working-directory: mobile
        run: >-
          ./gradlew
          :composeApp:compileKotlinIosArm64
          :composeApp:compileKotlinIosSimulatorArm64
          :composeApp:linkDebugFrameworkIosSimulatorArm64
          :composeApp:iosSimulatorArm64Test

      - name: Upload Compose iOS test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-ios-test-reports-${{ github.sha }}
          path: |
            mobile/composeApp/build/reports/tests/iosSimulatorArm64Test
            mobile/composeApp/build/test-results/iosSimulatorArm64Test
          if-no-files-found: warn
          retention-days: 7

  mobile:
    name: Android, iOS, and generated client gate
    needs:
      - docs
      - mobile_static
      - merchant_icon_pack
      - api_android_jvm
      - data_android_jvm
      - compose_android
      - android_app_unit_tests
      - android_app_release_lint
      - android_app_release
      - ios_host
      - api_ios
      - data_ios
      - compose_ios
      - quality
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require all mobile checks to pass
        if: ${{ needs.docs.result != 'success' || needs.mobile_static.result != 'success' || needs.merchant_icon_pack.result != 'success' || needs.api_android_jvm.result != 'success' || needs.data_android_jvm.result != 'success' || needs.compose_android.result != 'success' || needs.android_app_unit_tests.result != 'success' || needs.android_app_release_lint.result != 'success' || needs.android_app_release.result != 'success' || needs.ios_host.result != 'success' || needs.api_ios.result != 'success' || needs.data_ios.result != 'success' || needs.compose_ios.result != 'success' || needs.quality.result != 'success' }}
        run: exit 1

  quality:
    name: API quality gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare writable test workspaces
        run: mkdir -p .dev-tmp/actual/api-workspace .dev-tmp/postgres .dev-tmp/stryker

      - name: Run formatting, lint, typecheck, integration tests, and coverage
        run: docker compose -f docker-compose.dev.yml --profile test run --build --rm integration-tests

      - name: Audit production dependency advisories
        run: docker run --rm --network bridge tandem-for-actual-integration-tests pnpm audit --prod --audit-level high

      - name: Verify the pinned Actual API and server pair
        run: ./scripts/test-actual-compatibility.sh

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  deployment:
    name: Production image and disposable deployment gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deployment scripts and Compose configuration
        run: |
          bash -n deploy/backup.sh deploy/restore.sh deploy/tandem-setup.sh scripts/test-production-deployment.sh scripts/test-dockerignore-secrets.sh scripts/test-tandem-setup.sh
          node --test scripts/render-pinned-compose.test.mjs scripts/prune-nightly-api-versions.test.mjs scripts/nightly-ci-status.test.mjs
          ./scripts/test-tandem-setup.sh
          TANDEM_API_IMAGE=tandem-api:configuration-check TRUST_PROXY=127.0.0.1/32 docker compose --project-directory "$PWD" --env-file deploy/compose/.env.example -f deploy/compose/production.yml config --quiet

      - name: Verify secrets are excluded from Docker build contexts
        run: ./scripts/test-dockerignore-secrets.sh

      - name: Build and exercise the production API deployment
        run: ./scripts/test-production-deployment.sh

      - name: Validate Nginx configuration snippets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tandem-nginx-validation"
          cat > "$RUNNER_TEMP/tandem-nginx-validation/nginx.conf" <<'EOF'
          events {}
          http {
              include /validation/tandem-upstreams.conf.example;
              server {
                  listen 8080;
                  server_name budget.example.com;
                  include /validation/tandem-locations.conf.example;
              }
          }
          EOF
          docker run --rm \
            --add-host tandem-api:127.0.0.1 \
            --add-host actual-server:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/deploy/nginx:/validation:ro" \
            -v "$RUNNER_TEMP/tandem-nginx-validation/nginx.conf:/tmp/nginx.conf:ro" \
            nginx:1.30.6-alpine3.24@sha256:e9b2d7624fd7957f4ed44ae0a272d93fb73aeb8512ba8916f8118ae6143fd115 nginx -t -c /tmp/nginx.conf
