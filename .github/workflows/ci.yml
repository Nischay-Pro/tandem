name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Android, iOS, and generated client gate
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false

      - name: Install JavaScript build tools
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle
          cache-dependency-path: |
            mobile/gradle/libs.versions.toml
            mobile/gradle/wrapper/gradle-wrapper.properties
            mobile/**/*.gradle.kts

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 16111833
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Check mobile UI apostrophes
        run: python3 scripts/check-mobile-ui-apostrophes.py

      - name: Check mobile design tokens
        run: python3 scripts/check-mobile-design-tokens.py

      - name: Compile and test generated API client targets
        working-directory: mobile
        run: >-
          ./gradlew --no-daemon
          :api-client:compileAndroidMain
          :api-client:compileCommonMainKotlinMetadata
          :api-client:compileKotlinIosArm64
          :api-client:compileKotlinIosSimulatorArm64
          :api-client:jvmTest
          :api-client:koverVerify
          :api-client:ktlintCheck

      - name: Compile and test Android, JVM, and iOS data targets
        working-directory: mobile
        run: >-
          ./gradlew --no-daemon
          :data:compileAndroidMain
          :data:compileAndroidDeviceTest
          :data:compileCommonMainKotlinMetadata
          :data:compileKotlinJvm
          :data:compileKotlinIosArm64
          :data:compileKotlinIosSimulatorArm64
          :data:jvmTest
          :data:testAndroidHostTest
          :data:iosSimulatorArm64Test
          :data:koverVerify
          :data:ktlintCheck

      - name: Compile Compose app for Android and iOS
        working-directory: mobile
        run: >-
          ./gradlew --no-daemon
          :composeApp:compileAndroidMain
          :composeApp:compileKotlinIosArm64

      - name: Compile Compose app for iOS simulator
        working-directory: mobile
        run: ./gradlew --no-daemon :composeApp:compileKotlinIosSimulatorArm64

      - name: Run Compose app tests and KtLint
        working-directory: mobile
        run: ./gradlew --no-daemon :composeApp:allTests :composeApp:ktlintCheck

      - name: Run Android app unit tests
        working-directory: mobile
        run: ./gradlew --no-daemon :androidApp:testDebugUnitTest

      - name: Run Android release lint
        working-directory: mobile
        run: ./gradlew --no-daemon :androidApp:lintRelease

      - name: Assemble Android release
        working-directory: mobile
        run: ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Build iOS app host with Xcode
        working-directory: mobile
        run: |
          xcodebuild \
            -project iosApp/TandemForActual.xcodeproj \
            -scheme TandemForActual \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Android database persistence test on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: mobile
          script: ./gradlew --no-daemon :data:connectedAndroidDeviceTest

  quality:
    name: API quality gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare writable test workspaces
        run: mkdir -p .dev-tmp/actual/api-workspace .dev-tmp/postgres .dev-tmp/stryker

      - name: Run formatting, lint, typecheck, integration tests, and coverage
        run: docker compose -f docker-compose.dev.yml --profile test run --build --rm integration-tests

      - name: Audit production dependency advisories
        run: docker run --rm --network bridge tandem-for-actual-integration-tests pnpm audit --prod --audit-level high

      - name: Verify the pinned Actual API and server pair
        run: ./scripts/test-actual-compatibility.sh

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  storage-benchmark:
    name: Non-blocking API storage benchmark
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare writable test workspaces
        run: mkdir -p .dev-tmp/actual/api-workspace .dev-tmp/postgres .dev-tmp/stryker

      - name: Measure retained change-feed storage
        run: >-
          docker compose -f docker-compose.dev.yml --profile test run --build --rm
          -e RUN_STORAGE_BENCHMARK=true integration-tests
          pnpm --filter @tandem-for-actual/api exec vitest run
          test/budget-projection.integration.test.ts
          -t "reduces retained feed storage for 100,000 current transaction bodies"

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  deployment:
    name: Production image and disposable deployment gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deployment scripts and Compose configuration
        run: |
          bash -n deploy/backup.sh deploy/restore.sh scripts/test-production-deployment.sh scripts/test-dockerignore-secrets.sh
          TRUST_PROXY=127.0.0.1/32 docker compose --env-file deploy/compose/.env.example -f deploy/compose/production.yml config --quiet

      - name: Verify secrets are excluded from Docker build contexts
        run: ./scripts/test-dockerignore-secrets.sh

      - name: Build and exercise the production API deployment
        run: ./scripts/test-production-deployment.sh

      - name: Validate Nginx configuration snippets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tandem-nginx-validation"
          cat > "$RUNNER_TEMP/tandem-nginx-validation/nginx.conf" <<'EOF'
          events {}
          http {
              include /validation/tandem-upstreams.conf.example;
              server {
                  listen 8080;
                  server_name budget.example.com;
                  include /validation/tandem-locations.conf.example;
              }
          }
          EOF
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host actual-server:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/deploy/nginx:/validation:ro" \
            -v "$RUNNER_TEMP/tandem-nginx-validation/nginx.conf:/tmp/nginx.conf:ro" \
            nginx:1.30.6-alpine3.24@sha256:e9b2d7624fd7957f4ed44ae0a272d93fb73aeb8512ba8916f8118ae6143fd115 nginx -t -c /tmp/nginx.conf
