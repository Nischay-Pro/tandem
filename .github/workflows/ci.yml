name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether only Markdown changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          bash scripts/test-ci-ios-needed.sh
          docs_only="$(bash scripts/ci-docs-only.sh "$BASE_SHA" "$BUILD_SHA")"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "ios=$(bash scripts/ci-ios-needed.sh "$BASE_SHA" "$BUILD_SHA")" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation links and toolchain versions
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        run: ./scripts/check-github-workflows.sh

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Test documentation checks
        run: node --test scripts/check-docs.test.mjs

      - name: Check the demo budget is deterministic
        run: node --test scripts/demo-budget/generate.test.mjs

      - name: Check local documentation links and toolchain versions
        run: node scripts/check-docs.mjs

      - name: Check documentation wording
        if: needs.changes.outputs.docs_only == 'true'
        run: python3 scripts/check-mobile-ui-vocabulary.py

      - name: Check Markdown formatting
        if: needs.changes.outputs.docs_only == 'true'
        shell: bash
        run: |
          prettier_version="$(node -p 'require("./package.json").devDependencies.prettier')"
          git ls-files -z -- '*.md' | xargs -0 -r npm exec --yes --package="prettier@$prettier_version" -- prettier --check --

  pr_title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-pr-title.py "$PR_TITLE"

      - name: Check pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-pr-body.py

  merchant_icon_pack:
    name: Generate merchant icon resources on Linux
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
          run_install: false
          cache: true

      - name: Install icon pack build dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate merchant icon resources
        run: node scripts/generate-thesvg-icon-pack.mjs --output mobile/composeApp/build/generated/thesvg-icon-pack/composeResources

      - name: Upload merchant icon resources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tandem-merchant-icon-pack-${{ github.sha }}
          path: mobile/composeApp/build/generated/thesvg-icon-pack/composeResources
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  mobile_static:
    name: Mobile text and design-token checks
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check mobile UI apostrophes
        run: python3 scripts/check-mobile-ui-apostrophes.py

      - name: Check mobile design tokens
        run: python3 scripts/check-mobile-design-tokens.py

      - name: Check mobile UI vocabulary
        run: python3 scripts/check-mobile-ui-vocabulary.py

      - name: Check iOS Compose runtime properties
        run: python3 scripts/check-ios-info-plist.py

      - name: Test mobile UI vocabulary guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_mobile_ui_vocabulary.py'

      - name: Test pull request description guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_pr_body.py'

  api_android_jvm:
    name: API client · Android and JVM
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_android: "true"

      - name: Compile and test API client Android and JVM targets
        working-directory: mobile
        run: >-
          ./gradlew
          :api-client:compileAndroidMain
          :api-client:compileCommonMainKotlinMetadata
          :api-client:jvmTest
          :api-client:testAndroidHostTest
          :api-client:koverVerify
          :api-client:ktlintCheck

      - name: Round-trip edits and encrypted budgets through the pinned Actual server
        run: ./scripts/test-actual-compatibility.sh

  data_android_jvm:
    name: Data · Android and JVM
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_android: "true"

      - name: Compile and test data Android and JVM targets
        working-directory: mobile
        run: |
          ./gradlew \
            :data:compileAndroidMain \
            :data:compileAndroidDeviceTest \
            :data:compileCommonMainKotlinMetadata \
            :data:compileKotlinJvm \
            :data:jvmTest \
            :data:testAndroidHostTest \
            :data:koverVerify \
            :data:ktlintCheck

  compose_android:
    name: Compose · Android host
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_node: "true"
          setup_android: "true"

      - name: Compile and test Compose Android host targets
        working-directory: mobile
        run: >-
          ./gradlew
          :composeApp:compileAndroidMain
          :composeApp:testAndroidHostTest
          :composeApp:ktlintCheck

  android_app_unit_tests:
    name: Android app · unit tests
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_node: "true"
          setup_android: "true"

      - name: Run Android app unit tests
        working-directory: mobile
        run: ./gradlew :androidApp:testDebugUnitTest :androidApp:ktlintCheck :baselineprofile:ktlintCheck

  android_app_release_lint:
    name: Android app · release lint
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          setup_node: "true"
          setup_android: "true"

      - name: Run Android release lint
        working-directory: mobile
        run: |
          ./gradlew \
            :androidApp:lintRelease

  android_app_release:
    name: Android app · release assembly
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle_cache_key: android-release
          setup_node: "true"
          setup_android: "true"

      - name: Assemble Android release
        working-directory: mobile
        run: |
          ./gradlew \
            :androidApp:assembleRelease

  ios:
    name: iOS · Kotlin and Xcode simulator tests
    needs: [changes, merchant_icon_pack]
    if: needs.changes.outputs.docs_only == 'false' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TANDEM_PREGENERATED_ICON_PACK: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mobile build tools
        uses: ./.github/actions/setup-mobile-build
        with:
          gradle_cache_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle_cache_key: ios
          cache_kotlin_native: "true"

      - name: Download merchant icon resources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tandem-merchant-icon-pack-${{ github.sha }}
          path: mobile/composeApp/build/generated/thesvg-icon-pack/composeResources

      - name: Verify merchant icon resources
        run: test -f mobile/composeApp/build/generated/thesvg-icon-pack/composeResources/files/merchant-icon-catalog.json

      - name: Compile, link and test the Kotlin iOS targets
        working-directory: mobile
        env:
          DEVICE_TARGETS: ${{ github.ref == 'refs/heads/main' }}
        run: |
          tasks=(
            :api-client:compileCommonMainKotlinMetadata
            :data:compileCommonMainKotlinMetadata
            :api-client:compileKotlinIosSimulatorArm64
            :data:iosSimulatorArm64Test
            :composeApp:linkDebugFrameworkIosSimulatorArm64
            :composeApp:iosSimulatorArm64Test
          )
          if [[ "$DEVICE_TARGETS" == true ]]; then
            tasks+=(:api-client:compileKotlinIosArm64 :data:compileKotlinIosArm64 :composeApp:compileKotlinIosArm64)
          fi
          ./gradlew "${tasks[@]}"

      - name: Test iOS app host and background scheduler on iPhone and iPad
        working-directory: mobile
        env:
          EXTRA_DESTINATIONS: ${{ github.ref == 'refs/heads/main' }}
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = {k: v for k, v in json.load(sys.stdin)["devices"].items() if ".iOS-" in k}
          for runtime in sorted(runtimes, key=lambda k: [int(n) for n in re.findall(r"\d+", k.split(".iOS-")[1])], reverse=True):
              for device in runtimes[runtime]:
                  if re.search(sys.argv[1], device["name"]):
                      print(device["udid"])
                      sys.exit()
          ' "$1"
          }
          iphone="$(pick '^iPhone (?!Duo)')"
          ipad="$(pick '^iPad')"
          test -n "$iphone"
          test -n "$ipad"
          destinations=(-destination "platform=iOS Simulator,id=$iphone" -destination "platform=iOS Simulator,id=$ipad")
          if [[ "$EXTRA_DESTINATIONS" == true ]]; then
            duo="$(pick '^iPhone Duo')"
            if [[ -n "$duo" ]]; then
              destinations+=(-destination "platform=iOS Simulator,id=$duo")
            else
              echo "::notice::No iPhone Duo simulator on this runner image; testing iPhone and iPad only."
            fi
          fi
          xcodebuild \
            -project iosApp/TandemForActual.xcodeproj \
            -scheme TandemForActual \
            "${destinations[@]}" \
            -resultBundlePath "$RUNNER_TEMP/TandemForActual.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package the simulator app for screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator"
          zip -qry "$RUNNER_TEMP/TandemForActual-simulator.zip" TandemForActual.app

      - name: Upload the simulator app for screenshots
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/TandemForActual-simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode simulator test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-host-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/TandemForActual.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Compose iOS test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-ios-test-reports-${{ github.sha }}
          path: |
            mobile/composeApp/build/reports/tests/iosSimulatorArm64Test
            mobile/composeApp/build/test-results/iosSimulatorArm64Test
          if-no-files-found: warn
          retention-days: 7

      - name: Upload data iOS test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-ios-test-reports-${{ github.sha }}
          path: |
            mobile/data/build/reports/tests/iosSimulatorArm64Test
            mobile/data/build/test-results/iosSimulatorArm64Test
          if-no-files-found: warn
          retention-days: 7

  mobile:
    name: Android, iOS, and generated client gate
    needs:
      - changes
      - docs
      - mobile_static
      - merchant_icon_pack
      - api_android_jvm
      - data_android_jvm
      - compose_android
      - android_app_unit_tests
      - android_app_release_lint
      - android_app_release
      - ios
      - quality
    if: always() && needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    steps:
      - name: Require all mobile checks to pass
        if: ${{ needs.docs.result != 'success' || needs.mobile_static.result != 'success' || needs.merchant_icon_pack.result != 'success' || needs.api_android_jvm.result != 'success' || needs.data_android_jvm.result != 'success' || needs.compose_android.result != 'success' || needs.android_app_unit_tests.result != 'success' || needs.android_app_release_lint.result != 'success' || needs.android_app_release.result != 'success' || (needs.changes.outputs.ios == 'true' && needs.ios.result != 'success') || (needs.changes.outputs.ios != 'true' && needs.ios.result != 'skipped') || needs.quality.result != 'success' }}
        run: exit 1

  quality:
    name: API quality gate
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare writable test workspaces
        run: mkdir -p .dev-tmp/postgres .dev-tmp/stryker

      - name: Run formatting, lint, typecheck, integration tests, and coverage
        run: docker compose -f docker-compose.dev.yml --profile test run --build --rm integration-tests

      - name: Audit production dependency advisories
        run: docker run --rm --network bridge tandem-for-actual-integration-tests pnpm audit --prod --audit-level high

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans

  deployment:
    name: Production image and disposable deployment gate
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deployment scripts and Compose configuration
        run: |
          bash -n deploy/tandem-setup.sh deploy/configure-docker-nginx.sh scripts/test-production-deployment.sh scripts/test-dockerignore-secrets.sh scripts/test-tandem-setup.sh scripts/test-configure-docker-nginx.sh
          python3 -c 'from pathlib import Path; compile(Path("deploy/tandem-data.py").read_text(), "deploy/tandem-data.py", "exec")'
          node --test scripts/prune-nightly-api-versions.test.mjs scripts/nightly-ci-status.test.mjs
          ./scripts/test-tandem-setup.sh
          ./scripts/test-configure-docker-nginx.sh
          docker compose --project-directory "$PWD/deploy" --env-file "$PWD/deploy/example.env" -f "$PWD/deploy/docker-compose.yml" config --quiet

      - name: Verify secrets are excluded from Docker build contexts
        run: ./scripts/test-dockerignore-secrets.sh

      - name: Build and exercise the production API deployment
        run: ./scripts/test-production-deployment.sh

      - name: Validate Nginx configuration snippets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tandem-nginx-validation"
          cat > "$RUNNER_TEMP/tandem-nginx-validation/nginx.conf" <<'EOF'
          events {}
          http {
              include /validation/tandem-upstreams.conf.example;
              server {
                  listen 8080;
                  server_name budget.example.com;
                  include /validation/tandem-locations.conf.example;
              }
          }
          EOF
          docker run --rm \
            --add-host tandem-api:127.0.0.1 \
            --add-host actual-server:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/deploy/nginx:/validation:ro" \
            -v "$RUNNER_TEMP/tandem-nginx-validation/nginx.conf:/tmp/nginx.conf:ro" \
            nginx:1.30.6-alpine3.24@sha256:e9b2d7624fd7957f4ed44ae0a272d93fb73aeb8512ba8916f8118ae6143fd115 nginx -t -c /tmp/nginx.conf

  required_ci:
    name: Required CI
    needs:
      - changes
      - docs
      - mobile
      - deployment
      - pr_title
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require documentation, applicable suites, and the pull request title and description
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          PR_TITLE_RESULT: ${{ needs.pr_title.result }}
        run: |
          test "$CHANGE_RESULT" = success
          test "$DOCS_RESULT" = success
          if [[ "$DOCS_ONLY" == true ]]; then
            test "$MOBILE_RESULT" = skipped
            test "$DEPLOYMENT_RESULT" = skipped
          else
            test "$DOCS_ONLY" = false
            test "$MOBILE_RESULT" = success
            test "$DEPLOYMENT_RESULT" = success
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$PR_TITLE_RESULT" = success
          fi
