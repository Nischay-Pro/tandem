name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Android, iOS, and generated client gate
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle
          cache-dependency-path: |
            mobile/gradle/libs.versions.toml
            mobile/gradle/wrapper/gradle-wrapper.properties
            mobile/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 16111833
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Compile and test Android, JVM, and iOS data and client targets
        working-directory: mobile
        run: >-
          ./gradlew --no-daemon
          :api-client:compileAndroidMain
          :api-client:compileCommonMainKotlinMetadata
          :api-client:compileKotlinIosArm64
          :api-client:compileKotlinIosSimulatorArm64
          :api-client:jvmTest
          :api-client:koverVerify
          :api-client:ktlintCheck
          :data:compileAndroidMain
          :data:compileAndroidDeviceTest
          :data:compileCommonMainKotlinMetadata
          :data:compileKotlinJvm
          :data:compileKotlinIosArm64
          :data:compileKotlinIosSimulatorArm64
          :data:jvmTest
          :data:testAndroidHostTest
          :data:iosSimulatorArm64Test
          :data:koverVerify
          :data:ktlintCheck

      - name: Run Android database persistence test on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: mobile
          script: ./gradlew --no-daemon :data:connectedAndroidDeviceTest

  quality:
    name: API quality gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run formatting, lint, typecheck, integration tests, and coverage
        run: docker compose -f docker-compose.dev.yml --profile test run --build --rm integration-tests

      - name: Verify the pinned Actual API and server pair
        run: ./scripts/test-actual-compatibility.sh

      - name: Validate Nginx configuration snippets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/abc-nginx-validation"
          cat > "$RUNNER_TEMP/abc-nginx-validation/nginx.conf" <<'EOF'
          events {}
          http {
              include /validation/actual-companion-upstreams.conf.example;
              server {
                  listen 8080;
                  server_name budget.example.com;
                  include /validation/actual-companion-locations.conf.example;
              }
          }
          EOF
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host actual-server:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/deploy/nginx:/validation:ro" \
            -v "$RUNNER_TEMP/abc-nginx-validation/nginx.conf:/tmp/nginx.conf:ro" \
            nginx:1.30.6-alpine3.24 nginx -t -c /tmp/nginx.conf

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes --remove-orphans
