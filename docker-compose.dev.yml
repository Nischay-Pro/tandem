services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./.dev-tmp/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - companion-private

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://companion:${POSTGRES_PASSWORD:-development-only-password}@postgres:5432/companion
      HOST: 0.0.0.0
      PORT: 19753
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:19753:19753"
    networks:
      - companion-private

  integration-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    command: ["pnpm", "check:all"]
    environment:
      DATABASE_URL: postgresql://companion:${POSTGRES_PASSWORD:-development-only-password}@postgres:5432/companion
    volumes:
      - ./.dev-tmp/stryker:/workspace/.dev-tmp/stryker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - companion-private

  actual-compat-server:
    profiles: ["actual-compat"]
    image: actualbudget/actual-server:26.10.0
    user: "${ACTUAL_COMPAT_UID:-1000}:${ACTUAL_COMPAT_GID:-1000}"
    volumes:
      - ./.dev-tmp/actual/compat-server:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5006/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - companion-private

  actual-compat-tests:
    profiles: ["actual-compat"]
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    user: "${ACTUAL_COMPAT_UID:-1000}:${ACTUAL_COMPAT_GID:-1000}"
    command: ["pnpm", "--filter", "@actual-budget-companion/api", "test:actual"]
    environment:
      ACTUAL_SERVER_URL: http://actual-compat-server:5006
      ACTUAL_SERVER_PASSWORD: compatibility-test-only-password
      ACTUAL_API_DATA_DIR: /actual-api-data/device-one
    volumes:
      - ./.dev-tmp/actual/compat-client:/actual-api-data
    depends_on:
      actual-compat-server:
        condition: service_healthy
    networks:
      - companion-private

networks:
  companion-private:
    internal: true
