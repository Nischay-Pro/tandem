services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./.dev-tmp/postgres}
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - companion-private

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://companion:${POSTGRES_PASSWORD:-development-only-password}@postgres:5432/companion
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:-development-only-auth-token-encryption-key}
      HOST: 0.0.0.0
      PORT: 19753
      CHANGE_FEED_EPOCH: ${CHANGE_FEED_EPOCH:-default}
      ACTUAL_SERVER_URL: ${ACTUAL_SERVER_URL:-}
      ACTUAL_PUBLIC_URL: ${ACTUAL_PUBLIC_URL:-}
      ACTUAL_SESSION_TOKEN: ${ACTUAL_SESSION_TOKEN:-}
      ACTUAL_API_DATA_DIR: /data/actual-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:19753:19753"
    volumes:
      - ./.dev-tmp/actual/api-workspace:/data/actual-api
    networks:
      - companion-private

  integration-tests:
    profiles: ["test"]
    image: tandem-for-actual-integration-tests
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    command: ["pnpm", "check:all"]
    environment:
      DATABASE_URL: postgresql://companion:${POSTGRES_PASSWORD:-development-only-password}@postgres:5432/companion
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:-development-only-auth-token-encryption-key}
    volumes:
      - ./.dev-tmp/stryker:/workspace/.dev-tmp/stryker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - companion-private

  actual-compat-server:
    profiles: ["actual-compat"]
    image: ghcr.io/actualbudget/actual:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
    user: "${ACTUAL_COMPAT_UID:-1000}:${ACTUAL_COMPAT_GID:-1000}"
    volumes:
      - ./.dev-tmp/actual/compat-gate-server:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5006/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - companion-private

  actual-compat-tests:
    profiles: ["actual-compat"]
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    user: "0:0"
    command: ["pnpm", "--filter", "@tandem-for-actual/api", "test:actual"]
    environment:
      HOME: /home/node
      DATABASE_URL: postgresql://companion:${POSTGRES_PASSWORD:-development-only-password}@postgres:5432/companion
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:-development-only-auth-token-encryption-key}
      ACTUAL_SERVER_URL: http://actual-compat-server:5006
      ACTUAL_COMPAT_TEST_PASSWORD: compatibility-test-only-password
      ACTUAL_API_DATA_DIR: /actual-api-data/device-one
    volumes:
      - actual-compat-client-data:/actual-api-data
    depends_on:
      actual-compat-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - companion-private

networks:
  companion-private:
    internal: true

volumes:
  actual-compat-client-data:
