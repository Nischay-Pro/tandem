services:
  postgres:
    image: postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./.dev-tmp/postgres}
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandem -d tandem"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tandem-private

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://tandem:${POSTGRES_PASSWORD:-development-only-password}@postgres:5432/tandem
      HOST: 0.0.0.0
      PORT: 19753
      ACTUAL_SERVER_URL: ${ACTUAL_SERVER_URL:-http://actual-compat-server:5006}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:19753:19753"
    networks:
      - tandem-private

  integration-tests:
    profiles: ["test"]
    image: tandem-for-actual-integration-tests
    build:
      context: .
      dockerfile: services/api/Dockerfile.dev
    command: ["pnpm", "check:all"]
    environment:
      DATABASE_URL: postgresql://tandem:${POSTGRES_PASSWORD:-development-only-password}@postgres:5432/tandem
    volumes:
      - ./.dev-tmp/stryker:/workspace/.dev-tmp/stryker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tandem-private

  actual-compat-server:
    profiles: ["actual-compat"]
    image: ghcr.io/actualbudget/actual:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
    user: "${ACTUAL_COMPAT_UID:-1000}:${ACTUAL_COMPAT_GID:-1000}"
    volumes:
      - ./.dev-tmp/actual/compat-gate-server:/data
    ports:
      - "127.0.0.1:${ACTUAL_COMPAT_HOST_PORT:-55006}:5006"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5006/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - tandem-private

networks:
  tandem-private:
    internal: true
