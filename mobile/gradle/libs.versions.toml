[versions]
kotlin = "2.4.21"
androidGradlePlugin = "9.3.1"
openapiKmpGen = "1.5.0"
ktlintGradle = "14.2.0"
ktor = "3.5.0"
kover = "0.9.11"
room3 = "3.0.3"
sqlite = "2.7.1"
ksp = "2.3.12"
robolectric = "4.17"
coroutines = "1.11.0"
serialization = "1.10.0"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
openapiKmpGen = { id = "com.kroegerama.openapi-kmp-gen", version.ref = "openapiKmpGen" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }

[libraries]
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
room3Runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3Compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
sqliteBundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidxTestRunner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidxTestExtJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
