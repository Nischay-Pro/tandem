[versions]
kotlin = "2.4.21"
androidGradlePlugin = "9.5.0"
composeMultiplatform = "1.12.2"
jetpackCompose = "1.12.1"
openapiKmpGen = "1.6.0"
ktlintGradle = "14.2.0"
ktor = "3.6.1"
kover = "0.9.11"
room3 = "3.0.3"
sqlite = "2.7.1"
ksp = "2.3.13"
robolectric = "4.17"
coroutines = "1.11.0"
serialization = "1.12.0"
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
activityCompose = "1.13.0"
desugarJdkLibs = "2.1.5"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
openapiKmpGen = { id = "com.kroegerama.openapi-kmp-gen", version.ref = "openapiKmpGen" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }

[libraries]
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
room3Runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3Compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
sqliteBundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidxTestRunner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidxTestExtJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
desugarJdkLibs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
composeRuntimeAndroid = { module = "androidx.compose.runtime:runtime", version.ref = "jetpackCompose" }
composeUiAndroid = { module = "androidx.compose.ui:ui", version.ref = "jetpackCompose" }
composeFoundationAndroid = { module = "androidx.compose.foundation:foundation", version.ref = "jetpackCompose" }
composeMaterialAndroid = { module = "androidx.compose.material:material", version.ref = "jetpackCompose" }
